<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>devagarwal.me</title>
    <meta name="description" content="Personal site of Dev Agarwal, a student at Dartmouth.">

    <style>
        :root {
            --paper:  #fbfaf8;  /* warm off-white background */
            --ink:    #23282e;  /* near-black body text     */
            --teal:   #2c5f5d;  /* deep teal accent         */
            --muted:  #6f7680;  /* secondary text           */
            --rule:   #e6e2dc;  /* hairline borders         */
        }

        body {
            margin: 0 auto;
            max-width: 40rem;
            padding: 3.5rem 1.25rem;
            font: 16px/1.65 system-ui, sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        h1 {
            margin-bottom: 0.25rem;
            color: var(--teal);
            letter-spacing: -0.02em;
        }

        h2 {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .tagline { color: var(--muted); margin-top: 0; }

        nav { font-size: 0.875rem; }
        nav a { margin-right: 1rem; }

        a { color: var(--teal); text-underline-offset: 3px; }

        footer {
            margin-top: 3.5rem;
            border-top: 1px solid var(--rule);
            padding-top: 1rem;
            font-size: 0.875rem;
            color: var(--muted);
        }
    </style>

    <script>
        // Keep the copyright year in the footer current
        document.getElementById('year').textContent = new Date().getYear();
    </script>
</head>

<body>
<h1>Dev Agarwal</h1>
<p class="tagline">I'm taking CS52: Full-Stack Web Development.</p>

<nav>
    <a href="#classes">Classes</a>
    <a href="#project">Projects</a>
    <a href="#links">Links</a>
</nav>

<h2 id="classes">My classes:</h2>
<ul>
    <li>CS52!</li>
</ul>

<h2 id="projects">Projects</h2>
<ul>
    <li>
        <a href="https://github.com/dev0242/devagarwal.me" target="_blank">devagarwal.me</a>
        &mdash; this site, a hand-written static page hosted on GitHub Pages.
    </li>
</ul>

<h2 id="links">Links</h2>
<ul>
    <li><a href="https://github.com/dev0242">GitHub</a></li>
</ul>

<footer>
    <p>Thanks for visiting!</p>
    <p>&copy; <span id="year"></span> Dev Agarwal</p>
</footer>
</body>
</html>
