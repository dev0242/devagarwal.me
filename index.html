<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>devagarwal.me</title>
    <meta name="description" content="Personal site of Dev Agarwal, a student at Dartmouth.">

    <script>
        // Set theme before first paint to avoid a flash: saved choice, else OS preference.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved ? saved === 'dark'
                             : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>

    <style>
        :root {
            --paper:  #fbfaf8;  /* warm off-white background */
            --ink:    #23282e;  /* near-black body text     */
            --teal:   #2c5f5d;  /* deep teal accent         */
            --muted:  #6f7680;  /* secondary text           */
            --rule:   #e6e2dc;  /* hairline borders         */
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --paper:  #14181c;  /* dark background          */
            --ink:    #e8e6e3;  /* light text               */
            --teal:   #5fb8b3;  /* lighter teal accent      */
            --muted:  #9aa1a9;  /* secondary text           */
            --rule:   #2c333a;  /* hairline borders         */
            color-scheme: dark;
        }

        .theme-toggle {
            display: block;
            margin: 0 0 1.5rem auto;
            padding: 0.35rem 0.8rem;
            font: inherit;
            font-size: 0.875rem;
            color: var(--teal);
            background: transparent;
            border: 1px solid var(--rule);
            border-radius: 999px;
            cursor: pointer;
        }

        .theme-toggle:hover { border-color: var(--teal); }

        body {
            margin: 0 auto;
            max-width: 40rem;
            padding: 3.5rem 1.25rem;
            font: 16px/1.65 system-ui, sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        h1 {
            margin-bottom: 0.25rem;
            color: var(--teal);
            letter-spacing: -0.02em;
        }

        h2 {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .tagline { color: var(--muted); margin-top: 0; }

        a { color: var(--teal); text-underline-offset: 3px; }

        footer {
            margin-top: 3.5rem;
            border-top: 1px solid var(--rule);
            padding-top: 1rem;
            font-size: 0.875rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>

<h1>Dev Agarwal</h1>
<p class="tagline">I'm taking CS52: Full-Stack Web Development.</p>

<h2>My classes:</h2>
<ul>
    <li>CS52!</li>
</ul>

<h2>Links</h2>
<ul>
    <li><a href="https://github.com/dev0242">GitHub</a></li>
</ul>

<footer>
    <p>Thanks for visiting!</p>
</footer>
<script>
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');

    function renderToggle() {
        var dark = root.dataset.theme === 'dark';
        toggle.textContent = dark ? '☀️ Light' : '🌙 Dark';
        toggle.setAttribute('aria-pressed', dark);
    }

    toggle.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        renderToggle();
    });

    renderToggle();
</script>
</body>
</html>
