name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review PRs that Claude opens from @claude issue fixes
          allowed_bots: 'claude'
          # Log Claude's full conversation so we can see why a review was skipped.
          # Temporary: this makes the output visible to anyone who can view the Actions logs.
          show_full_output: true
          # A direct prompt instead of the code-review plugin: the plugin delegates its first
          # step to a background agent, and the run ended before that agent reported back.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs. Read the diff with `gh pr diff` and the
            changed files in the checkout, and do the review yourself in this session
            (don't hand it off to subagents).

            Focus on real defects: code that crashes, behaves incorrectly, or breaks
            existing functionality. Skip style nits.

            For each bug, leave an inline comment on the relevant line explaining the
            problem and the fix, with a suggestion block when the fix is small. If you
            find no bugs, leave one short PR comment saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git fetch:*),Bash(chromium:*),Bash(chromium-browser:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

